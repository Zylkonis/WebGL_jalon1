<html lang="">

<head>
	<title>WebGL - Canvas test</title>
	<meta http-equiv="content-type" content="text/html; charset=ISO-8859-1"/>
	<link href="styles/style.css" rel="stylesheet" type="text/css" />

	<script type="text/javascript" src="glMatrix.js"></script>
	<script type="text/javascript" src="callbacks.js"></script>
	<script type="text/javascript" src="glCourseBasis.js"></script>
	<script type="text/javascript" src="objLoader.js"></script>
	<script type="text/javascript" src="interface.js"></script>
    <script type="text/javascript" src="mesh/base_mesh.js"></script>
    <script type="text/javascript" src="mesh/heightMap.js"></script>
    <script type="text/javascript" src="mesh/obj_mesh.js"></script>
    <script type="text/javascript" src="mesh/plane.js"></script>

</head>


<body onload="webGLStart();" onresize="adaptCanvasSize();">
    <div id="container">
        <canvas id="WebGL-test" style="border:none;" width="800" height="600"></canvas>

        <div id="options">
            <input type="file" id="filePicker" accept=".obj" onChange="objFilePicker(this.files[0]);"/>
            <select id="objSelect" onChange="objChangeSelect(this.value);">
                <option value="bunny.obj" selected>Bunny</option>
                <option value="mustang.obj">Mustang</option>
                <option value="porsche.obj">Porsche</option>
                <option value="sphere.obj">Sphere</option>
            </select>
            <select id="shaderSelect" onChange="shaderChangeSelect(this.value);">
                <option value="obj" selected>Obj shader</option>
                <option value="wire">Wire shader</option>
                <option value="blingfong">Bling Fong shader</option>
                <option value="gradient">Gradient shader</option>
            </select>
            <div>
                <input type="range" id="shini_value" name="shini_value" min="0.0" max="30.0" oninput="shaderChangeShini(this.value);"/>
                <label for="shini_value">shininess</label>
            </div>
            <div>
                <input type="range" id="li_value" name="li_value" min="0.0" max="5.0" oninput="shaderChangeLi(this.value);"/>
                <label for="li_value">light intensity</label>
            </div>
            <div>
                <input type="color" onchange="shaderChangeColor(this.value);"/>
            </div>
            <div>
                <input type="checkbox" id="wireframeCheckbox" name="scales"/>
                <label for="wireframeCheckbox">Wireframe</label>
            </div>
            <HR WIDTH="100%">
            <div>
                <fieldset>
                    <input type="radio" id="plane_radio" value="plane" name="plane_type" checked oninput="changePlaneType(this.value)"/>
                    <label for="plane_radio">Plane</label>

                    <input type="radio" id="bump_radio" value="bump" name="plane_type" oninput="changePlaneType(this.value)"/>
                    <label for="bump_radio">Bump</label>

                    <input type="radio" id="height_radio" value="height" name="plane_type" oninput="changePlaneType(this.value)"/>
                    <label for="height_radio">Height</label>

                    <input type="radio" id="mipmap_radio" value="mipmap" name="plane_type" oninput="changePlaneType(this.value)"/>
                    <label for="mipmap_radio">MipMap</label>
                </fieldset>
            </div>
            <div>
                <input type="color" onchange="planeChangeColor(this.value);"/>
            </div>
            <div id="bump_option" style="display:none">
                <p class="option_title">Option de la bump map</p>
                <input type="file" id="bmpPicker" accept=".png" onChange="bmpFilePicker(this.files[0]);"/>
            </div>
            <div id="height_option" style="display:none">
                <p class="option_title">Option de la height map</p>
                <input type="file" id="heightPicker" accept=".png" onChange="heightFilePicker(this.files[0]);"/>
                <div>
                    <input type="range" id="heightScale" min="0.0" max="50.0" value="scale" oninput="heightChange(this.value);"/>
                    <label for="heightScale">Échelle de hauteur</label>
                </div>
                <div>
                    <fieldset>
                        <input type="radio" id="height_gradient_radio" value="gradient" name="height_type" checked oninput="changeHeightShader(this.value)"/>
                        <label for="height_gradient_radio">Gradient</label>

                        <input type="radio" id="height_texture_radio" value="texture" name="height_type" oninput="changeHeightShader(this.value)"/>
                        <label for="height_texture_radio">Texture</label>

                        <input type="radio" id="height_mipmap_radio" value="mipmapheight" name="height_type" oninput="changeHeightShader(this.value)"/>
                        <label for="height_mipmap_radio">MipMap</label>
                    </fieldset>
                </div>
            </div>
            <div id="mipmap_option" style="display:none">
                <p class="option_title">Option de la mipmap</p>
                <input type="range" id="tresh_1to2_scale" step="0.01" min="0.0" max="1.0" oninput="changeTreshold_1to2(this.value);"/>
                <label for="tresh_1to2_scale">Treshold 1</label>
                <input type="range" id="tresh_2to3_scale" step="0.01" min="0.0" max="1.0" oninput="changeTreshold_2to3(this.value);"/>
                <label for="tresh_2to3_scale">Treshold 2</label>
            </div>
        </div>
    </div>
</body>


</html>
