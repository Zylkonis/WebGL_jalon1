<!DOCTYPE html>
<html lang="">

<head>
	<title>WebGL - Canvas test</title>
	<meta http-equiv="content-type" content="text/html; charset=ISO-8859-1"/>
	<link href="styles/style.css" rel="stylesheet" type="text/css" />

	<script type="text/javascript" src="glMatrix.js"></script>
	<script type="text/javascript" src="callbacks.js"></script>
	<script type="text/javascript" src="glCourseBasis.js"></script>
	<script type="text/javascript" src="objLoader.js"></script>
	<script type="text/javascript" src="interface.js"></script>
    <script type="text/javascript" src="noise.js"></script>
    <script type="text/javascript" src="mesh/base_mesh.js"></script>
    <script type="text/javascript" src="mesh/heightMap.js"></script>
    <script type="text/javascript" src="mesh/obj_mesh.js"></script>
    <script type="text/javascript" src="mesh/plane.js"></script>
    <script type="text/javascript" src="mesh/cloud.js"></script>
</head>


<body onload="webGLStart();" onresize="adaptCanvasSize();">
    <div id="container">
        <canvas id="WebGL-test" style="border:none;" width="800" height="600"></canvas>

        <div id="options">
            <div>
                <input type="color" id="skyColorPicker" onchange="SkyChangeColor(this.value);"/>
                <label for="skyColorPicker">Skybox color</label>

                <input type="range" id="nbClouds_value" name="nbClouds_value" min="0" max="500" value="200" oninput="CloudChangeNb(this.value);"/>
                <p id="label_nbClouds">Number of clouds : 200</p>

                <input type="number" id="cloud_resolution" name="cloud_resolution" min="1" max="250" value="64" oninput="ChangeCloudResolution(this.value);"/>
                <label for="cloud_resolution">Clouds resolution (attention tres experimental)</label>

                <input type="range" id="clouds_distInAir" name="clouds_distInAir" min="0" max="3" value="1" step="0.01" oninput="CloudChangeDistInAir(this.value);"/>
                <label for="clouds_distInAir">Clouds distance in the air</label>

                <input type="range" id="clouds_height" name="clouds_height" min="0" max="3" value="1" step="0.01" oninput="CloudChangeHeight(this.value);"/>
                <label for="clouds_height">Clouds height</label>

                <input type="range" id="clouds_size" name="clouds_size" min="0" max="5" value="1" step="0.1" oninput="CloudChangeSize(this.value);"/>
                <label for="clouds_size">Clouds size</label>

                <input class="button" id="regenerate_clouds" type="button" value="Regenerate clouds" onclick="RegenerateClouds()"/>
                <br>
                <input type="color" id="cloudsColorPicker" onchange="CloudChangeColor(this.value);"/>
                <label for="cloudsColorPicker">Clouds color</label>

                <input type="range" id="densityCloud_value" name="densityCloud_value" min="0" max="1.0" value="0.8" step="0.01" oninput="CloudChangeDepth(this.value);"/>
                <label for="densityCloud_value">Clouds density</label>

                <input type="range" id="depthCloud_value" name="depthCloud_value" min="0" max="1.0" value="0.4" step="0.01" oninput="CloudChangeDensity(this.value);"/>
                <label for="depthCloud_value">Clouds depth</label>

                <input type="range" id="absorptionCloud_value" name="absorptionCloud_value" min="0" max="200.0" value="60.0" step="0.5" oninput="CloudChangeAbsorption(this.value);"/>
                <label for="absorptionCloud_value">Clouds absorption</label>

                <input type="range" id="transmittanceCloud_value" name="transmittanceCloud_value" min="0" max="200.0" value="35.0" step="0.5" oninput="CloudChangeTransmittance(this.value);"/>
                <label for="transmittanceCloud_value">Clouds transmittance</label>

                <input type="checkbox" id="cloudsHeightOffset" value="false" onchange="setCloudOffset(this.value);">
                <label for="cloudsHeightOffset">Funny but strange clouds (experimental)</label>

                <input type="checkbox" id="cloudsActivateLightMarching" value="false" onchange="CloudActivateLightMarching(this.value);">
                <label for="cloudsActivateLightMarching">Light marching for clouds</label>

                <input type="range" id="angleCloud_value" name="angleCloud_value" min="0" max="6.28318530718" value="0" step="0.01" oninput="CloudChangeAngle(this.value);"/>
                <label for="angleCloud_value">Clouds angle</label>

                <input type="range" id="speedCloud_value" name="speedCloud_value" min="0" max="1" value="0.1" step="0.01" oninput="CloudChangeSpeed(this.value);"/>
                <label for="speedCloud_value">Clouds speed</label>
            </div>
            <HR WIDTH="100%">
            <input type="file" id="filePicker" accept=".obj" onChange="objFilePicker(this.files[0]);"/>
            <select id="objSelect" onChange="objChangeSelect(this.value);">
                <option value="bunny.obj" selected>Bunny</option>
                <option value="mustang.obj">Mustang</option>
                <option value="porsche.obj">Porsche</option>
                <option value="sphere.obj">Sphere</option>
            </select>
            <select id="shaderSelect" onChange="shaderChangeSelect(this.value);">
                <option value="obj" selected>Obj shader</option>
                <option value="wire">Wire shader</option>
                <option value="blingfong">Bling Fong shader</option>
                <option value="gradient">Gradient shader</option>
            </select>
            <div>
                <input type="range" id="shini_value" name="shini_value" min="0.0" max="30.0" oninput="shaderChangeShini(this.value);"/>
                <label for="shini_value">shininess</label>
            </div>
            <div>
                <input type="range" id="li_value" name="li_value" min="0.0" max="5.0" oninput="shaderChangeLi(this.value);"/>
                <label for="li_value">light intensity</label>
            </div>
            <div>
                <input type="color" onchange="shaderChangeColor(this.value);"/>
            </div>
            <div>
                <input type="checkbox" id="wireframeCheckbox" name="scales"/>
                <label for="wireframeCheckbox">Wireframe</label>
                <input type="checkbox" id="objDrawnCheckbox" name="scales"/>
                <label for="wireframeCheckbox">Draw obj</label>
            </div>
            <HR WIDTH="100%">
            <div>
                <fieldset>
                    <input type="radio" id="plane_radio" value="plane" name="plane_type" checked oninput="changePlaneType(this.value)"/>
                    <label for="plane_radio">Plane</label>

                    <input type="radio" id="bump_radio" value="bump" name="plane_type" oninput="changePlaneType(this.value)"/>
                    <label for="bump_radio">Bump</label>

                    <input type="radio" id="height_radio" value="height" name="plane_type" oninput="changePlaneType(this.value)"/>
                    <label for="height_radio">Height</label>
                </fieldset>
            </div>
            <div>
                <input type="color" onchange="planeChangeColor(this.value);"/>
            </div>
            <div id="bump_option" style="display:none">
                <p class="option_title">Option de la bump map</p>
                <input type="file" id="bmpPicker" accept=".png" onChange="bmpFilePicker(this.files[0]);"/>
            </div>
            <div id="height_option" style="display:none">
                <p class="option_title">Option de la height map</p>
                <input type="file" id="heightPicker" accept=".png" onChange="heightFilePicker(this.files[0]);"/>
                <div>
                    <input type="range" id="heightScale" min="0.0" max="200.0" value="scale" oninput="heightChange(this.value);"/>
                    <label for="heightScale">Échelle de hauteur</label>
                </div>
                <input type="checkbox" id="oceanDrawnCheckbox" name="scales" oninput="initOcean();"/>
                <label for="oceanDrawnCheckbox">Draw ocean</label>
                <div>
                    <fieldset>
                        <input type="radio" id="height_gradient_radio" value="gradient" name="height_type" checked oninput="changeHeightShader(this.value)"/>
                        <label for="height_gradient_radio">Gradient</label>

                        <input type="radio" id="height_texture_radio" value="texture" name="height_type" oninput="changeHeightShader(this.value)"/>
                        <label for="height_texture_radio">Texture</label>

                        <input type="radio" id="height_mipmap_radio" value="mipmapheight" name="height_type" oninput="changeHeightShader(this.value)"/>
                        <label for="height_mipmap_radio">MipMap</label>
                    </fieldset>
                </div>

                <div id="height_mipmap_option_files" style="display:none">
                    <p>Texture 1</p>
                    <input type="file" id="heightMipMapTexture1Picker" accept=".png" onChange="heightMipMapTextureFilePicker(this.files[0], 1);"/>
                    <input type="file" id="heightMipMap1Picker" accept=".png" onChange="heightMipMapTextureFilePicker(this.files[0], 2);"/>
                    <p>Texture 2</p>
                    <input type="file" id="heightMipMapTexture2Picker" accept=".png" onChange="heightMipMapTextureFilePicker(this.files[0], 3);"/>
                    <input type="file" id="heightMipMap2Picker" accept=".png" onChange="heightMipMapTextureFilePicker(this.files[0], 4);"/>
                    <p>Texture 3</p>
                    <input type="file" id="heightMipMapTexture3Picker" accept=".png" onChange="heightMipMapTextureFilePicker(this.files[0], 5);"/>
                    <input type="file" id="heightMipMap3Picker" accept=".png" onChange="heightMipMapTextureFilePicker(this.files[0], 6);"/>
                </div>
            </div>
            <div id="mipmap_option" style="display:none">
                <p class="option_title">Option de la mipmap</p>
                <input type="range" id="tresh_1to2_scale" step="0.01" min="0.0" max="1.0" oninput="changeTreshold_1to2(this.value);"/>
                <label for="tresh_1to2_scale">Treshold 1</label>
                <input type="range" id="delta_1to2_scale" step="0.01" min="0.0" max="1.0" oninput="changeDelta_1to2(this.value);"/>
                <label for="delta_1to2_scale">Delta 1</label>
                <input type="range" id="tresh_2to3_scale" step="0.01" min="0.0" max="1.0" oninput="changeTreshold_2to3(this.value);"/>
                <label for="tresh_2to3_scale">Treshold 2</label>
                <input type="range" id="delta_2to3_scale" step="0.01" min="0.0" max="1.0" oninput="changeDelta_2to3(this.value);"/>
                <label for="delta_2to3_scale">Delta 2</label>
            </div>
        </div>
    </div>
</body>


</html>
